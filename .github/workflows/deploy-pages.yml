# GitHub Pages deployment for the Fixlinx site (static Next.js export).
#
# Since 2026-10-31: builds for www.fixlinx.com (custom domain, root path).
#
# Every push to main:
#   1. embeds data/diy + data/news into the bundle (static-data.ts)
#   2. builds a plain static `out/` directory (root path, no /fixlinxcom)
#   3. generates sitemap.xml + robots.txt via scripts/generate-seo.py
#   4. publishes it to GitHub Pages (serves www.fixlinx.com + apex 301→www)
#
# Legacy sub-path rebuild (i5858555255.github.io/fixlinxcom):
#   Set NEXT_PUBLIC_PAGES_BASE="/fixlinxcom" and
#   NEXT_PUBLIC_SITE_ORIGIN="https://i5858555255.github.io" as
#   GitHub repo variables before pushing.
#
# Local node-server mode is untouched: run `npm start` without
# NEXT_OUTPUT=static and /api routes + /manage still work live.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment + id token for the action
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional overrides via GitHub Actions repository variables
      # (Settings → Secrets and variables → Variables).
      # All three are optional — the code defaults are:
      #   PAGES_BASE       = "" (root build, www.fixlinx.com)
      #   SITE_ORIGIN      = "https://www.fixlinx.com"
      #   SITEMAP_BASE_URL = "https://www.fixlinx.com"
      #
      # To rebuild the legacy sub-path (i5858555255.github.io/fixlinxcom),
      # set these three variables before pushing:
      #   PAGES_BASE         = "/fixlinxcom"
      #   SITE_ORIGIN        = "https://i5858555255.github.io"
      #   SITEMAP_BASE_URL   = "https://i5858555255.github.io/fixlinxcom"
      # Then remove them afterwards to return to the www build.
      NEXT_PUBLIC_PAGES_BASE: ${{ vars.PAGES_BASE }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      FIXLINX_SITEMAP_BASE_URL: ${{ vars.SITEMAP_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Embed static data
        run: |
          # inlines data/diy/*.json + data/news/*.json into src/generated/static-data.ts
          python scripts/embed-static-data.py

      - name: Build static export
        run: NEXT_OUTPUT=static npm run build

      - name: Generate sitemap.xml + robots.txt
        run: python scripts/generate-seo.py --output-dir out

      - name: SEO smoke check
        run: |
          # 1. sitemap + robots exist and sitemap is valid XML
          test -f out/sitemap.xml  || { echo "FAIL: out/sitemap.xml missing"; exit 1; }
          test -f out/robots.txt   || { echo "FAIL: out/robots.txt missing"; exit 1; }
          python -c "
          import xml.etree.ElementTree as ET
          ET.parse('out/sitemap.xml')
          print('sitemap.xml: valid XML')
          "

          # 2. canonical link in index.html
          grep -q 'rel="canonical"' out/index.html \
            || { echo "FAIL: no canonical link in index.html"; exit 1; }

          # 3. if root build: CSS must NOT have /fixlinxcom prefix
          #    (the var PAGES_BASE default is "" = root; a sub-path build
          #    sets vars.PAGES_BASE="/fixlinxcom" which skips this check)
          if [ -z "${{ vars.PAGES_BASE }}" ] || [ "${{ vars.PAGES_BASE }}" = "root" ]; then
            css_files=$(ls out/_next/static/css/*.css 2>/dev/null | head -1)
            if [ -n "$css_files" ]; then
              grep -q '/fixlinxcom/' "$css_files" \
                && { echo "FAIL: CSS has /fixlinxcom/ prefix in root build"; exit 1; }
              echo "CSS: no /fixlinxcom prefix (root build OK)"
            fi
            # canonical should point to www.fixlinx.com
            grep -q 'www.fixlinx.com' out/index.html \
              || { echo "WARN: index.html canonical does not point to www.fixlinx.com"; }
          fi
          echo "SEO smoke check passed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
