# GitHub Pages deployment for the Fixlinx site (static Next.js export).
#
# Every push to main:
#   1. embeds data/diy + data/news into the bundle (static-data.ts)
#   2. builds a plain static `out/` directory (no node server needed)
#   3. generates sitemap.xml + robots.txt via scripts/generate-seo.py
#   4. publishes it to GitHub Pages
#
# Local node-server mode is untouched: run `npm start` without
# NEXT_OUTPUT=static and /api routes + /manage still work live.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment + id token for the action
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Embed static data
        run: |
          # inlines data/diy/*.json + data/news/*.json into src/generated/static-data.ts
          python scripts/embed-static-data.py

      - name: Build static export
        run: NEXT_OUTPUT=static npm run build

      - name: Generate sitemap.xml + robots.txt
        run: python scripts/generate-seo.py --output-dir out

      - name: SEO smoke check
        run: |
          # verify sitemap and robots were generated and are well-formed
          test -f out/sitemap.xml  || { echo "FAIL: out/sitemap.xml missing"; exit 1; }
          test -f out/robots.txt   || { echo "FAIL: out/robots.txt missing"; exit 1; }
          # verify sitemap is valid XML
          python -c "
          import xml.etree.ElementTree as ET, sys
          ET.parse('out/sitemap.xml')
          print('sitemap.xml: valid XML')
          "
          # verify at least one canonical link exists in index.html
          grep -q 'rel="canonical"' out/index.html \
            || { echo "WARN: no canonical link in index.html"; exit 1; }
          echo "SEO smoke check passed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
