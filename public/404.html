<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Fixlinx Industrial</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #2f2f2f;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        padding: 48px 56px;
        max-width: 520px;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.04em;
      }
      .card p {
        margin: 0 0 24px;
        color: #6b7280;
        font-size: 15px;
        line-height: 1.6;
      }
      .card a {
        display: inline-block;
        background: #f59e0b;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      .card a:hover { background: #d97706; }
    </style>
    <script>
      // GitHub Pages serves this for any unknown path under the project.
      // The published site lives at /fixlinxcom/ — redirect to the home page.
      const base = window.location.pathname.startsWith("/fixlinxcom")
        ? "/fixlinxcom/"
        : "https://i5858555255.github.io/fixlinxcom/";
      window.location.replace(base);
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Page Not Found</h1>
      <p>The page you requested does not exist. Redirecting to the Fixlinx home page...</p>
