<svg viewBox="0 0 2280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fixlinx industrial production operation flow">
  <defs>
    <marker id="arr-o" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 Z" fill="#C7CCD1"/>
    </marker>
    <style>
      text{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;fill:#000;}
      .b{font-weight:700;}
      .main{stroke:#F59E0B;stroke-width:3;fill:none;}
      .branch{stroke:#C7CCD1;stroke-width:3;fill:none;}
      .node{fill:#fff;stroke:#2F2F2F;stroke-width:2.5;}
      .circ{fill:#fff;stroke:#2F2F2F;stroke-width:2.5;}
      .lbl{font-size:20px;letter-spacing:.03em;}
      .lbl2{font-size:15px;}
      .small{font-size:13px;fill:#6b7280;font-weight:500;}
      .op{font-size:30px;letter-spacing:.18em;}
    </style>
  </defs>

  <rect x="0" y="0" width="2280" height="700" fill="#fff"/>

  <!-- ============ TOP LANE  (y=55..115) ============ -->
  <!-- WORK ORDER -->
  <g>
    <rect class="node" x="480" y="55" width="220" height="60" rx="10"/>
    <text class="b lbl" x="590" y="90" text-anchor="middle" dominant-baseline="central">WORK ORDER</text>
  </g>
  <!-- MFG. DEPT. -->
  <g>
    <rect class="node" x="850" y="55" width="220" height="60" rx="10"/>
    <text class="b lbl" x="960" y="90" text-anchor="middle" dominant-baseline="central">MFG. DEPT.</text>
  </g>
  <!-- TOTAL INSPECTION : standalone label circle, not part of flow -->
  <g>
    <circle class="circ" cx="1160" cy="85" r="40"/>
    <text class="b small" x="1160" y="78" text-anchor="middle">TOTAL</text>
    <text class="b small" x="1160" y="96" text-anchor="middle">INSPECTION</text>
  </g>

  <!-- ============ MIDDLE LANE (y=270..330) ============ -->
  <!-- PURCHASE ORDER -->
  <g>
    <rect class="node" x="30" y="270" width="220" height="60" rx="10"/>
    <text class="b lbl" x="140" y="305" text-anchor="middle" dominant-baseline="central">PURCHASE ORDER</text>
  </g>
  <!-- EXAM & APPROVAL -->
  <g>
    <rect class="node" x="360" y="270" width="240" height="60" rx="10"/>
    <text class="b lbl" x="480" y="305" text-anchor="middle" dominant-baseline="central">EXAM &amp; APPROVAL</text>
  </g>
  <!-- WAREHOUSE ADMINISTRATION + inner label -->
  <g>
    <rect class="node" x="700" y="262" width="300" height="76" rx="10"/>
    <text class="b lbl" x="850" y="290" text-anchor="middle" dominant-baseline="central">WAREHOUSE</text>
    <text class="b lbl" x="850" y="316" text-anchor="middle" dominant-baseline="central">ADMINISTRATION</text>
    <text class="small" x="850" y="334" text-anchor="middle">MATERIAL PREPARATION</text>
  </g>
  <!-- ISSUANCE OF MATERIAL : circular action node -->
  <g>
    <circle class="circ" cx="1120" cy="300" r="56"/>
    <text class="b lbl2" x="1120" y="288" text-anchor="middle">ISSUANCE OF</text>
    <text class="b lbl2" x="1120" y="312" text-anchor="middle">MATERIAL</text>
  </g>
  <!-- PRODUCTION -->
  <g>
    <rect class="node" x="1240" y="270" width="220" height="60" rx="10"/>
    <text class="b lbl" x="1350" y="305" text-anchor="middle" dominant-baseline="central">PRODUCTION</text>
  </g>
  <!-- FINISHED PRODUCT & SEMI-PRODUCT -->
  <g>
    <rect class="node" x="1550" y="262" width="320" height="76" rx="10"/>
    <text class="b lbl" x="1710" y="290" text-anchor="middle" dominant-baseline="central">FINISHED PRODUCT</text>
    <text class="b lbl" x="1710" y="316" text-anchor="middle" dominant-baseline="central">&amp; SEMI-PRODUCT</text>
  </g>

  <!-- ============ BRANCH A (light-gray return) ============ -->
  <!-- SECONDARY PROCESSING -->
  <g>
    <rect class="node" x="1550" y="430" width="300" height="60" rx="10"/>
    <text class="b lbl" x="1700" y="465" text-anchor="middle" dominant-baseline="central">SECONDARY PROCESSING</text>
  </g>

  <!-- ============ QC LANE ============ -->
  <!-- QC -->
  <g>
    <rect class="node" x="1960" y="270" width="180" height="60" rx="10"/>
    <text class="b lbl" x="2050" y="305" text-anchor="middle" dominant-baseline="central">QC</text>
  </g>
  <!-- NG (branch up, returns to MFG. DEPT.) -->
  <g>
    <rect class="node" x="1960" y="150" width="120" height="52" rx="10"/>
    <text class="b lbl" x="2020" y="180" text-anchor="middle" dominant-baseline="central">NG</text>
  </g>
  <!-- OK (branch down, to WAREHOUSE ENTRY) -->
  <g>
    <rect class="node" x="1960" y="380" width="120" height="52" rx="10"/>
    <text class="b lbl" x="2020" y="410" text-anchor="middle" dominant-baseline="central">OK</text>
  </g>
  <!-- WAREHOUSE ENTRY -->
  <g>
    <rect class="node" x="1960" y="500" width="240" height="56" rx="10"/>
    <text class="b lbl" x="2080" y="530" text-anchor="middle" dominant-baseline="central">WAREHOUSE ENTRY</text>
  </g>
  <!-- OQC : to the right of WAREHOUSE ENTRY -->
  <g>
    <rect class="node" x="2250" y="500" width="80" height="56" rx="10"/>
    <text class="b lbl" x="2290" y="530" text-anchor="middle" dominant-baseline="central">OQC</text>
  </g>

  <!-- ================= ORANGE MAIN-LINE CONNECTORS ================= -->
  <!-- 1. PURCHASE ORDER -> EXAM & APPROVAL -->
  <path class="main" d="M250,300 L360,300" marker-end="url(#arr-o)"/>
  <!-- 2a. EXAM & APPROVAL up -> WORK ORDER -->
  <path class="main" d="M500,270 L500,185 L590,185 L590,115" marker-end="url(#arr-o)"/>
  <!-- 2b. EXAM & APPROVAL right -> WAREHOUSE ADMINISTRATION -->
  <path class="main" d="M600,300 L700,300" marker-end="url(#arr-o)"/>
  <!-- 3. WORK ORDER down -> WAREHOUSE ADMINISTRATION -->
  <path class="main" d="M590,115 L590,160 L850,160 L850,262" marker-end="url(#arr-o)"/>
  <!-- 4. WAREHOUSE ADMINISTRATION -> ISSUANCE OF MATERIAL -->
  <path class="main" d="M1000,300 L1064,300" marker-end="url(#arr-o)"/>
  <!-- 5. ISSUANCE OF MATERIAL -> MFG. DEPT. -->
  <path class="main" d="M1176,300 L1220,300 L1220,90 L1070,90" marker-end="url(#arr-o)"/>
  <!-- 6. MFG. DEPT. -> PRODUCTION -->
  <path class="main" d="M1070,90 L1070,200 L1350,200 L1350,270" marker-end="url(#arr-o)"/>
  <!-- 7. PRODUCTION -> FINISHED PRODUCT & SEMI-PRODUCT -->
  <path class="main" d="M1460,300 L1550,300" marker-end="url(#arr-o)"/>
  <!-- 8. FINISHED PRODUCT -> QC (right edge of the FINISHED PRODUCT half) -->
  <path class="main" d="M1870,290 L1960,290" marker-end="url(#arr-o)"/>
  <!-- 9b. OK -> WAREHOUSE ENTRY (orange main, downward) -->
  <path class="main" d="M2020,432 L2020,500" marker-end="url(#arr-o)"/>
  <!-- 9. WAREHOUSE ENTRY -> OQC (rightward) -->
  <path class="main" d="M2200,530 L2250,530" marker-end="url(#arr-o)"/>

  <!-- ================= LIGHT-GRAY BRANCH / RETURN CONNECTORS ================= -->
  <!-- Branch A: from SEMI-PRODUCT (lower half) down to SECONDARY PROCESSING -->
  <path class="branch" d="M1700,338 L1700,430" marker-end="url(#arr-g)"/>
  <!-- SECONDARY PROCESSING back to FINISHED PRODUCT & SEMI-PRODUCT (NOT warehouse) -->
  <path class="branch" d="M1550,460 L1470,460 L1470,300 L1550,300" marker-end="url(#arr-g)"/>
  <!-- QC branch 1 (NG): QC up to NG, NG returns left to MFG. DEPT. (rework) -->
  <path class="branch" d="M2050,270 L2050,202" marker-end="url(#arr-g)"/>
  <path class="branch" d="M1960,176 L970,176" marker-end="url(#arr-g)"/>
  <!-- QC branch 2 (OK): QC down to OK -->
  <path class="branch" d="M2050,330 L2050,380" marker-end="url(#arr-g)"/>

  <!-- ================= OPERATION FOOTER (centered, decorative lines) ================= -->
  <line x1="790" y1="640" x2="1040" y2="640" stroke="#F59E0B" stroke-width="3"/>
  <text class="op b" x="1140" y="650" text-anchor="middle" dominant-baseline="central">OPERATION</text>
  <line x1="1240" y1="640" x2="1490" y2="640" stroke="#F59E0B" stroke-width="3"/>
</svg>
